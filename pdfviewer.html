<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Viewer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; background: #474a4d; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

/* Toolbar */
#toolbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: #2b2d30; color: #c8ccd0; padding: 0 12px;
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; border-bottom: 1px solid #1e1f22;
    height: 34px; user-select: none;
}
#toolbar button {
    background: transparent; color: #c8ccd0; border: 1px solid transparent;
    padding: 0; cursor: pointer; border-radius: 4px; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    min-width: 28px; height: 26px; transition: background 0.15s;
}
#toolbar button:hover { background: #3c3f41; border-color: #4e5155; }
#toolbar button:active { background: #4e5155; }
#toolbar input[type="number"] {
    width: 46px; text-align: center; padding: 1px 4px;
    border-radius: 4px; border: 1px solid #4e5155;
    background: #1e1f22; color: #c8ccd0; font-size: 12px;
    height: 24px; -moz-appearance: textfield;
}
#toolbar input::-webkit-outer-spin-button,
#toolbar input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
#toolbar input:focus { outline: none; border-color: #6366f1; }
.toolbar-sep { width: 1px; height: 18px; background: #4e5155; margin: 0 2px; }
.toolbar-spacer { flex: 1; }
.toolbar-label { font-size: 12px; color: #8b8f94; }
#zoomSelect {
    background: #1e1f22; color: #c8ccd0; border: 1px solid #4e5155;
    border-radius: 4px; padding: 1px 2px; font-size: 12px; height: 24px; cursor: pointer;
}
#zoomSelect:focus { outline: none; border-color: #6366f1; }

/* Loading */
#loadingBar {
    position: fixed; top: 34px; left: 0; right: 0; height: 3px;
    background: transparent; z-index: 101;
}
#loadingProgress { height: 100%; width: 0%; background: #6366f1; transition: width 0.3s ease; }

/* Viewer Container */
#viewerContainer {
    position: absolute; top: 34px; bottom: 0; left: 0; right: 0;
    overflow: auto; padding: 10px 0;
}

/* Page Rendering */
.page-wrapper {
    margin: 0 auto 10px; position: relative;
    background: white; box-shadow: 0 1px 6px rgba(0,0,0,0.35);
}
.page-wrapper canvas { display: block; }

/* Text layer for selection */
.textLayer {
    position: absolute; left: 0; top: 0; right: 0; bottom: 0;
    overflow: hidden; opacity: 0.25; line-height: 1.0;
}
.textLayer > span {
    color: transparent; position: absolute; white-space: pre;
    transform-origin: 0% 0%; pointer-events: all; cursor: text;
}
.textLayer ::selection { background: rgba(0, 0, 170, 0.4); }
.textLayer .endOfContent { display: block; position: absolute; left: 0; top: 100%; right: 0; bottom: 0; z-index: -1; cursor: default; user-select: none; }

/* Error / Loading states */
#errorMessage {
    display: none; color: #f87171; text-align: center; padding: 60px 20px;
    font-size: 15px; line-height: 1.6;
}
#loadingMessage {
    color: #8b8f94; text-align: center; padding: 60px 20px; font-size: 14px;
}
</style>
</head>
<body>

<div id="toolbar">
    <button id="prevPage" title="Previous Page">&#8249;</button>
    <input id="pageNum" type="number" value="1" min="1">
    <span class="toolbar-label">/ <span id="pageCount">-</span></span>
    <button id="nextPage" title="Next Page">&#8250;</button>
    <div class="toolbar-sep"></div>
    <button id="zoomOut" title="Zoom Out">&minus;</button>
    <select id="zoomSelect">
        <option value="0.5">50%</option>
        <option value="0.75">75%</option>
        <option value="1">100%</option>
        <option value="1.25">125%</option>
        <option value="1.5" selected>150%</option>
        <option value="2">200%</option>
        <option value="auto">Fit Width</option>
    </select>
    <button id="zoomIn" title="Zoom In">+</button>
    <div class="toolbar-spacer"></div>
</div>

<div id="loadingBar"><div id="loadingProgress"></div></div>

<div id="viewerContainer">
    <div id="loadingMessage">Loading PDF...</div>
    <div id="errorMessage"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function() {
    'use strict';

    // Check PDF.js loaded
    if (typeof pdfjsLib === 'undefined') {
        document.getElementById('loadingMessage').style.display = 'none';
        const err = document.getElementById('errorMessage');
        err.style.display = 'block';
        err.textContent = 'PDF.js library failed to load. Check your internet connection.';
        return;
    }

    pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // DOM references
    const viewerContainer = document.getElementById('viewerContainer');
    const pageNumInput = document.getElementById('pageNum');
    const pageCountSpan = document.getElementById('pageCount');
    const loadingProgress = document.getElementById('loadingProgress');
    const loadingMessage = document.getElementById('loadingMessage');
    const errorMessage = document.getElementById('errorMessage');
    const zoomSelect = document.getElementById('zoomSelect');

    let pdfDoc = null;
    let currentScale = 1.5;
    let pages = [];
    let totalPages = 0;
    let currentPageNum = 1;
    let rendering = false;

    // Parse parameters — support both query string and hash-based passing
    const params = new URLSearchParams(window.location.search);
    let fileUrl = params.get('file');
    
    // Fallback: check if URL was passed as hash (some webviews strip query params from iframes)
    if (!fileUrl && window.location.hash) {
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        fileUrl = hashParams.get('file');
    }
    
    const hashMatch = (window.location.hash || '').match(/page=(\d+)/);
    const initialPage = (hashMatch ? parseInt(hashMatch[1]) : parseInt(params.get('page'))) || 1;

    function getEffectiveScale() {
        if (currentScale === 'auto') {
            const containerWidth = viewerContainer.clientWidth - 30;
            return Math.max(0.5, containerWidth / 612);
        }
        return parseFloat(currentScale);
    }

    async function loadDocument(url) {
        try {
            loadingProgress.style.width = '20%';
            loadingMessage.textContent = 'Loading PDF...';

            const loadingTask = pdfjsLib.getDocument({ url: url, cMapPacked: true });
            loadingTask.onProgress = function(progress) {
                if (progress.total > 0) {
                    loadingProgress.style.width = Math.min(70, (progress.loaded / progress.total) * 100) + '%';
                }
            };

            pdfDoc = await loadingTask.promise;
            totalPages = pdfDoc.numPages;
            pageCountSpan.textContent = totalPages;
            pageNumInput.max = totalPages;

            loadingProgress.style.width = '80%';
            loadingMessage.textContent = 'Rendering pages...';

            await renderAllPages();

            loadingProgress.style.width = '100%';
            setTimeout(function() { loadingProgress.style.width = '0%'; }, 600);

            // Navigate to initial page
            if (initialPage > 1 && initialPage <= totalPages) {
                setTimeout(function() { scrollToPage(initialPage); }, 100);
            }
        } catch (err) {
            console.error('Failed to load PDF:', err);
            loadingMessage.style.display = 'none';
            errorMessage.style.display = 'block';
            errorMessage.innerHTML = 'Failed to load PDF.<br><small>' + (err.message || err) + '</small>';
            loadingProgress.style.width = '0%';
        }
    }

    async function renderAllPages() {
        // Clear viewer
        viewerContainer.innerHTML = '';
        pages = [];
        rendering = true;

        var scale = getEffectiveScale();

        for (var i = 1; i <= totalPages; i++) {
            var page = await pdfDoc.getPage(i);
            var viewport = page.getViewport({ scale: scale });

            var wrapper = document.createElement('div');
            wrapper.className = 'page-wrapper';
            wrapper.dataset.pageNum = i;
            wrapper.style.width = Math.floor(viewport.width) + 'px';
            wrapper.style.height = Math.floor(viewport.height) + 'px';

            var canvas = document.createElement('canvas');
            canvas.width = Math.floor(viewport.width);
            canvas.height = Math.floor(viewport.height);
            wrapper.appendChild(canvas);

            viewerContainer.appendChild(wrapper);

            // Render to canvas
            var ctx = canvas.getContext('2d');
            await page.render({ canvasContext: ctx, viewport: viewport }).promise;

            // Text layer for text selection
            try {
                var textContent = await page.getTextContent();
                var textLayerDiv = document.createElement('div');
                textLayerDiv.className = 'textLayer';
                textLayerDiv.style.width = Math.floor(viewport.width) + 'px';
                textLayerDiv.style.height = Math.floor(viewport.height) + 'px';
                wrapper.appendChild(textLayerDiv);

                pdfjsLib.renderTextLayer({
                    textContent: textContent,
                    container: textLayerDiv,
                    viewport: viewport,
                    textDivs: []
                });
            } catch (e) {
                // Text layer is optional - silently ignore errors
            }

            pages.push({ wrapper: wrapper });
        }

        rendering = false;
    }

    function scrollToPage(pageNum) {
        if (pageNum < 1 || pageNum > totalPages) return;
        var wrapper = viewerContainer.querySelector('[data-page-num="' + pageNum + '"]');
        if (wrapper) {
            wrapper.scrollIntoView({ behavior: 'auto', block: 'start' });
            // Small offset for padding
            viewerContainer.scrollTop = Math.max(0, viewerContainer.scrollTop - 10);
            currentPageNum = pageNum;
            pageNumInput.value = pageNum;
        }
    }

    // Track current visible page on scroll
    var scrollTimeout;
    viewerContainer.addEventListener('scroll', function() {
        clearTimeout(scrollTimeout);
        scrollTimeout = setTimeout(function() {
            var containerRect = viewerContainer.getBoundingClientRect();
            var midpoint = containerRect.top + containerRect.height * 0.3;
            for (var i = 0; i < pages.length; i++) {
                var rect = pages[i].wrapper.getBoundingClientRect();
                if (rect.bottom > midpoint) {
                    var newPage = i + 1;
                    if (newPage !== currentPageNum) {
                        currentPageNum = newPage;
                        pageNumInput.value = newPage;
                    }
                    break;
                }
            }
        }, 80);
    });

    // Toolbar: prev/next page
    document.getElementById('prevPage').addEventListener('click', function() {
        if (currentPageNum > 1) scrollToPage(currentPageNum - 1);
    });
    document.getElementById('nextPage').addEventListener('click', function() {
        if (currentPageNum < totalPages) scrollToPage(currentPageNum + 1);
    });

    // Toolbar: page number input
    pageNumInput.addEventListener('change', function() {
        var p = parseInt(pageNumInput.value);
        if (p >= 1 && p <= totalPages) scrollToPage(p);
        else pageNumInput.value = currentPageNum;
    });
    pageNumInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.target.blur();
            var p = parseInt(pageNumInput.value);
            if (p >= 1 && p <= totalPages) scrollToPage(p);
            else pageNumInput.value = currentPageNum;
        }
    });

    // Toolbar: zoom
    document.getElementById('zoomOut').addEventListener('click', function() {
        var idx = zoomSelect.selectedIndex;
        if (idx > 0) { zoomSelect.selectedIndex = idx - 1; zoomSelect.dispatchEvent(new Event('change')); }
    });
    document.getElementById('zoomIn').addEventListener('click', function() {
        var idx = zoomSelect.selectedIndex;
        if (idx < zoomSelect.options.length - 1) { zoomSelect.selectedIndex = idx + 1; zoomSelect.dispatchEvent(new Event('change')); }
    });
    zoomSelect.addEventListener('change', function() {
        currentScale = zoomSelect.value;
        var savedPage = currentPageNum;
        renderAllPages().then(function() {
            setTimeout(function() { scrollToPage(savedPage); }, 50);
        });
    });

    // postMessage API — external navigation from parent frame
    window.addEventListener('message', function(e) {
        if (e.data && e.data.type === 'goToPage') {
            var page = parseInt(e.data.page);
            if (page >= 1 && page <= totalPages) {
                scrollToPage(page);
            }
        }
        // Allow parent to send the PDF URL via postMessage (fallback for webviews that strip query params)
        if (e.data && e.data.type === 'loadPdf' && e.data.url && !pdfDoc) {
            console.log('Loading PDF via postMessage:', e.data.url);
            loadDocument(e.data.url);
        }
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
        if (e.key === 'PageUp') { e.preventDefault(); if (currentPageNum > 1) scrollToPage(currentPageNum - 1); }
        else if (e.key === 'PageDown') { e.preventDefault(); if (currentPageNum < totalPages) scrollToPage(currentPageNum + 1); }
        else if (e.key === 'Home' && e.ctrlKey) { e.preventDefault(); scrollToPage(1); }
        else if (e.key === 'End' && e.ctrlKey) { e.preventDefault(); scrollToPage(totalPages); }
    });

    // Start loading
    if (fileUrl) {
        loadDocument(decodeURIComponent(fileUrl));
    } else {
        loadingMessage.style.display = 'none';
        errorMessage.style.display = 'block';
        errorMessage.textContent = 'No PDF file specified.';
    }
})();
</script>
</body>
</html>
